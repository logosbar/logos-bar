<!doctype html><html><head><meta charset="utf-8"><title>LogosBar Icon Mockups</title>
<style>
body{font:15px -apple-system,system-ui,sans-serif;margin:24px;background:#f4f4f6;color:#1d1d1f}
h1{font-size:22px}.card{background:#fff;border-radius:14px;padding:18px 20px;margin-bottom:18px;box-shadow:0 1px 3px #0002}
h2{margin:0 0 4px;font-size:17px}p{margin:0 0 12px;color:#555}
.row{display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap;padding:14px;border-radius:10px}
.light{background:#ececee}.dark{background:#1e1e20;color:#aaa;margin-top:8px}
.s{text-align:center;font-size:11px;color:#888}.s img{display:block;margin:0 auto 4px}
.mb{display:flex;gap:16px;align-items:center;height:24px;padding:0 12px;border-radius:6px;font-size:13px}
.mb.l{background:#e8e8ea}.mb.d{background:#2a2a2c;color:#ddd}.mb.d img{filter:invert(1)}
</style></head><body><h1>LogosBar icon mockups</h1><div id="c"></div>
<div class="card"><h2>Menu-bar template (goes with C)</h2><p>One-color template image, shown at real menu-bar size (22 px tall).</p>
<div class="mb l"><span>Wi-Fi</span><img src="menubar-template.svg" height="18"><span>12:04</span></div><br>
<div class="mb d"><span>Wi-Fi</span><img src="menubar-template.svg" height="18"><span>12:04</span></div></div>
<script>
const opts=[["a-refined.svg","A · Refined original","Same idea, but the bar is wider than the book, the buttons are four tiles (one gold), and the book is simpler."],
["b-ribbon.svg","B · Bookmark-ribbon bar","The book's gold ribbon runs down the spine and becomes the bar, with a bookmark tail below."],
["c-toolbar.svg","C · Toolbar only","No book. A tilted bar with four action tiles (cross, search, bookmark, more). Clearest when small."],
["d-lambda.svg","D · λ button","A raised gold button with λ (for λόγος). Minimal, but doesn't say \"toolbar.\""]];
const sizes=[256,128,64,32,16];
document.getElementById('c').innerHTML=opts.map(([f,t,d])=>{
const r=cls=>`<div class="row ${cls}">${sizes.map(z=>`<div class="s"><img src="${f}" width="${z}" height="${z}">${z}px</div>`).join('')}</div>`;
return `<div class="card"><h2>${t}</h2><p>${d}</p>${r('light')}${r('dark')}</div>`}).join('');
</script></body></html>
